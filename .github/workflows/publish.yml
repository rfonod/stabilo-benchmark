# Publish the package to PyPI when a GitHub release is published.
#
# Uses PyPI trusted publishing (OIDC), so no API token is stored anywhere. The PyPI side is
# registered for: owner rfonod, repository stabilo-benchmark, workflow publish.yml, environment
# pypi. Renaming this file or the environment breaks that registration.
#
# The same release event also fires the Zenodo webhook, which archives the tagged tree using
# whatever .zenodo.json says at that moment.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      # The tag and the package version must agree, or PyPI and Zenodo archive different versions.
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r\"__version__ = '([^']+)'\", pathlib.Path('stabilo_benchmark/__init__.py').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stabilo-benchmark/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Tolerate a re-created release for the same version (e.g. when retrying a
          # failed GitHub->Zenodo archive): skip files already on PyPI instead of erroring.
          skip-existing: true

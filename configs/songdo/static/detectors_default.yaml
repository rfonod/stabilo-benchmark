# =============================================================================
# Part I: the detector axis at the default thresholds, unmasked.
#
#   stabilo-benchmark static configs/songdo/static/detectors_default.yaml \
#       --scenes data/songdo/static --scenes-list configs/songdo/static/scenes_eval.txt
#
# Pins `filter_ratio` and `ransac_epipolar_threshold` at the pre-tuning defaults, so `report` can
# compare tuned and default mAA on the evaluation scenes. Masking `none`, as in tuning. 10 runs.
# =============================================================================

kind: static
name: detectors_default
seed: 0
trials: 100

scenes:
  dir: ../../../data/songdo/static # images/, labels_hbb/, labels_obb/

perturbation:
  geometric:
    translation_ratio: 0.10
    rotation_deg: 15.0
    scale_ratio: 0.05
    projective: 5.0e-5
  photometric:
    - { name: brightness, range: [0.75, 1.25] }
    - { name: saturation, range: [0.95, 1.05] }
    - { name: blur, max_ksize: 5 }
    - { name: fog, max_density: 0.10 }
    - { name: noise, max_sigma: 3.0 }
    - { name: jpeg, quality: [70, 95] }

metrics:
  hea_thresholds: [1.0, 2.0, 3.0, 5.0, 10.0]
  object_boxes: obb

pipeline:
  preset:
    - orb
    - sift
    - rsift
    - brisk
    - akaze
    - xfeat
    - disk_lightglue
    - dedode_lightglue
    - keynet_lightglue
    - loftr
  masking: [none]
  filter_ratio: 0.9
  # Keyed by detector name (see config.expand_grid).
  ransac_epipolar_threshold:
    orb: 2.0
    sift: 3.0
    rsift: 3.0
    brisk: 2.5
    akaze: 2.5
    xfeat: 2.0
    disk: 2.0
    dedode: 2.0
    keynet: 2.0
    loftr: 2.0

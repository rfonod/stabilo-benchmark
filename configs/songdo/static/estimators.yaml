# =============================================================================
# Part I: robust estimator and inlier threshold.
#
#   stabilo-benchmark static configs/songdo/static/estimators.yaml --scenes data/songdo/static -v 1
#
# The detector is fixed; the estimator and its inlier threshold are swept. Confidence (0.999999)
# and the iteration cap (5000) are fixed. The threshold is in reference-frame pixels.
# =============================================================================

kind: static
name: estimators
seed: 0
trials: 100

scenes:
  dir: ../../../data/songdo/static # images/, labels_hbb/, labels_obb/

perturbation:
  geometric:
    translation_ratio: 0.10
    rotation_deg: 15.0
    scale_ratio: 0.05
    projective: 5.0e-5
  # Identical to detectors.yaml.
  photometric:
    - { name: brightness, range: [0.75, 1.25] }
    - { name: saturation, range: [0.95, 1.05] }
    - { name: blur, max_ksize: 5 }
    - { name: fog, max_density: 0.10 }
    - { name: noise, max_sigma: 3.0 }
    - { name: jpeg, quality: [70, 95] }

metrics:
  hea_thresholds: [1.0, 2.0, 3.0, 5.0]
  # Boxes IoU and OCE are scored on, whatever the masking mode: obb (default) or hbb.
  object_boxes: obb

pipeline:
  preset: [orb, sift]
  masking: [obb]
  # OpenCV method codes, named as OpenCV's USAC tutorial defines them:
  #   4  LMEDS          8  RANSAC          16 RHO
  #   32 USAC_DEFAULT   -> standard LO-RANSAC
  #   33 USAC_PARALLEL  -> the same, run in parallel
  #   35 USAC_FAST      -> the same, with fewer local-optimization iterations
  #   36 USAC_ACCURATE  -> GC-RANSAC
  #   37 USAC_PROSAC    -> PROSAC        38 USAC_MAGSAC -> MAGSAC++
  #
  # Nine codes, seven algorithms. 33 is not bit-exact across repeated calls
  # (see `stabilo_benchmark/seeding.py`). None of them is DEGENSAC.
  ransac_method: [4, 8, 16, 32, 33, 35, 36, 37, 38]
  ransac_epipolar_threshold: [0.5, 1.0, 1.5, 2.0, 3.0, 4.0]
  # `transformation_type` must stay projective: cv2.estimateAffinePartial2D accepts only LMEDS and
  # RANSAC, and the other methods would be recorded as 100% failures.

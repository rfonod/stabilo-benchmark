# =============================================================================
# Part I: the detector axis at hover-scale perturbation.
#
#   stabilo-benchmark static configs/songdo/static/detectors_hover.yaml \
#       --scenes data/songdo/static --scenes-list configs/songdo/static/scenes_eval.txt
#
# detectors.yaml with the geometric perturbation reduced to the drift and yaw of a hovering
# platform. Same photometric chain, masking axis and trial count. 10 pipelines x 3 maskings = 30
# runs.
# =============================================================================

kind: static
name: detectors_hover
seed: 0
trials: 100

scenes:
  dir: ../../../data/songdo/static # images/, labels_hbb/, labels_obb/

perturbation:
  geometric:
    translation_ratio: 0.02
    rotation_deg: 2.0
    scale_ratio: 0.01
    projective: 0.0
  photometric:
    - { name: brightness, range: [0.75, 1.25] }
    - { name: saturation, range: [0.95, 1.05] }
    - { name: blur, max_ksize: 5 }
    - { name: fog, max_density: 0.10 }
    - { name: noise, max_sigma: 3.0 }
    - { name: jpeg, quality: [70, 95] }

metrics:
  hea_thresholds: [1.0, 2.0, 3.0, 5.0, 10.0]
  object_boxes: obb

pipeline:
  preset:
    - orb
    - sift
    - rsift
    - brisk
    - akaze
    - xfeat
    - disk_lightglue
    - dedode_lightglue
    - keynet_lightglue
    - loftr
  masking: [none, hbb, obb]

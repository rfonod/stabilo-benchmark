# =============================================================================
# Part II, offline regime: per-pipeline tuning of the ratio test and the inlier threshold on
# dynamic footage.
#
#   stabilo-benchmark dynamic <tuning case> -c configs/songdo/dynamic/offline_tuning.yaml -v 1   # each case
#   stabilo-benchmark report <case 1>/results/offline_tuning <case 2>/results/offline_tuning ...  # pooled
#
# One ratio x threshold grid for every pipeline at the offline budget (downsample ratio 0.5, 2000
# features), scored against the reference estimator, on tuning cases drawn from Part I's tuning
# sites (disjoint from the evaluation cases by site). The inlier threshold is in processed-image
# pixels (`ransac_threshold_space: processed`), so the grid and the incumbent values keep their
# meaning relative to keypoint localization as the frames shrink. 6 presets x
# 14 ratios x 13 thresholds, plus 13 thresholds for each of the 4 presets without a ratio test = 1144
# runs per case. A pipeline keeps Part I's values unless a grid point beats them by more than the
# mAA equivalence margin; write the selected pairs into the per-detector `filter_ratio` and
# `ransac_epipolar_threshold` of offline_masking.yaml and offline_margin.yaml.
# =============================================================================

kind: dynamic
name: offline_tuning
seed: 0

# 'first', 'middle', or a frame index; `prepare --reference` overrides it.
reference: first

# Measurements per frame pair. Raise it to measure run-to-run variation (USAC_PARALLEL, torch
# detectors on a GPU).
repeats: 1

sampling:
  # The bins of offline_masking.yaml with up to 5 pairs each, drawn from the frames a case
  # prepared with offline_masking.yaml holds.
  mode: stratified
  per_bin: 5
  bins:
    - [1, 1]
    - [2, 3]
    - [4, 7]
    - [8, 15]
    - [16, 31]
    - [32, 63]
    - [64, 127]
    - [128, 255]
    - [256, 511]
    - [512, 1023]
    - [1024, 2047]
    - [2048, 3600]
  # Offset bins `survey` reads a candidate at, one offset per bin at its geometric center: the
  # first second, while the objects in view at the reference are still shared with it.
  survey_bins:
    - [1, 1]
    - [2, 3]
    - [4, 7]
    - [8, 15]
    - [16, 31]
  # Offset bins of the GCP audit: `annotate-gcp` picks two sampled frames in each, and `audit`
  # summarizes the residual per bin.
  audit_bins:
    - [1, 3]
    - [4, 31]
    - [32, 511]
    - [512, 3600]

# The reference estimator; its error is bounded by `audit`.
oracle:
  preset: oracle
  masking: obb

metrics:
  hea_thresholds: [1.0, 3.0, 5.0, 10.0]
  # Boxes IoU and OCE are scored on, whatever the masking mode: obb (default) or hbb.
  object_boxes: obb
  # Selection reads mAA only.
  photometric: []
  region:
    # Constant-pixel margin around every object in both frames.
    mask_dilation_px: 10
    # Erosion of the region at the frame edges.
    border_px: 8
    # Below this area fraction a pair is scored as the identity warp.
    min_area_fraction: 0.05
    # Optional ground-plane polygon (LabelMe JSON or `x y` text).
    ground_plane_roi: null
    # Polygons over above-ground structure on the reference frame, a file inside each case
    # directory (LabelMe JSON or `x y` text), excluded from the region; null for none.
    exclusion: null

store_homographies: false

pipeline:
  preset:
    - orb
    - sift
    - rsift
    - brisk
    - akaze
    - xfeat
    - disk_lightglue
    - dedode_lightglue
    - keynet_lightglue
    - loftr
  downsample_ratio: 0.5
  max_features: 2000
  ransac_threshold_space: processed
  # Masking is held at `none`, as in Part I's tuning.
  masking: [none]
  filter_ratio: [0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.93, 0.96, 0.99]
  ransac_epipolar_threshold: [0.1, 0.15, 0.25, 0.5, 1.0, 1.5, 2.0, 3.0, 4.0, 6.0, 8.0, 12.0, 16.0]

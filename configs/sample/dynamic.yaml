# =============================================================================
# Sample dynamic benchmark: Part II on the committed sample case, in the order the protocol
# prescribes (no video, detector weights or GPU needed):
#
#   case=data/sample/dynamic/2022-10-06_D9_AM3_S2
#   stabilo-benchmark oracle  $case -c configs/sample/dynamic.yaml
#   stabilo-benchmark audit   $case
#   stabilo-benchmark dynamic $case -c configs/sample/dynamic.yaml -v 1
#   stabilo-benchmark audit   $case --results $case/results/smoke
#   stabilo-benchmark report  $case/results/smoke
#
# configs/songdo/dynamic/offline_masking.yaml restricted to ORB and SIFT. Ten frames of one case
# exercise every code path but support no conclusion. See data/sample/README.md.
# =============================================================================

kind: dynamic
name: smoke
seed: 0

# 'first', 'middle', or a frame index; `prepare --reference` overrides it.
reference: first

# Measurements per frame pair. Raise it to measure run-to-run variation (USAC_PARALLEL, torch
# detectors on a GPU).
repeats: 1

sampling:
  # Every pair registers a sampled frame onto the reference. Offsets are stratified in bins one
  # octave wide, 15 pairs in each bin that holds that many and every offset of the four shortest
  # (15 together), so short offsets (objects shared with the reference) and long ones (objects
  # turned over) carry comparable weight. 3600 frames is 2 min at 29.97 fps. On the sample case it
  # selects all nine frames after the reference.
  mode: stratified
  per_bin: 15
  bins:
    - [1, 1]
    - [2, 3]
    - [4, 7]
    - [8, 15]
    - [16, 31]
    - [32, 63]
    - [64, 127]
    - [128, 255]
    - [256, 511]
    - [512, 1023]
    - [1024, 2047]
    - [2048, 3600]
  # Offset bins `survey` reads a candidate at, one offset per bin at its geometric center: the
  # first second, while the objects in view at the reference are still shared with it.
  survey_bins:
    - [1, 1]
    - [2, 3]
    - [4, 7]
    - [8, 15]
    - [16, 31]
  # Offset bins of the GCP audit: `annotate-gcp` picks two sampled frames in each, and `audit`
  # summarizes the residual per bin.
  audit_bins:
    - [1, 3]
    - [4, 31]
    - [32, 511]
    - [512, 3600]

# The reference estimator; its error is bounded by `audit`.
oracle:
  preset: oracle
  masking: obb

metrics:
  hea_thresholds: [1.0, 3.0, 5.0, 10.0]
  # Boxes IoU and OCE are scored on, whatever the masking mode: obb (default) or hbb.
  object_boxes: obb
  photometric: [ssim, zncc, mi, gradient]
  region:
    # Constant-pixel margin around every object in both frames.
    mask_dilation_px: 10
    # Erosion of the region at the frame edges.
    border_px: 8
    # Below this area fraction a pair is scored as the identity warp.
    min_area_fraction: 0.05
    # Optional ground-plane polygon (LabelMe JSON or `x y` text).
    ground_plane_roi: null
    # Polygons over above-ground structure on the reference frame, a file inside each case
    # directory (LabelMe JSON or `x y` text), excluded from the region; null for none.
    exclusion: EXCLUSION.json

# Nine floats per measurement; needed by `audit --results`.
store_homographies: true

# ORB and SIFT, at the offline budget, under all three masking modes.
pipeline:
  preset:
    - orb
    - sift
  downsample_ratio: 0.5
  max_features: 2000
  ransac_threshold_space: processed
  # Per-detector values selected by configs/songdo/dynamic/offline_tuning.yaml: a pipeline keeps
  # Part I's values unless a grid point beats them by more than the mAA margin.
  filter_ratio:
    orb: 0.85
    sift: 0.4
  ransac_epipolar_threshold:
    orb: 4.0
    sift: 0.1
  masking: [none, hbb, obb]

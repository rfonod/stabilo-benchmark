# =============================================================================
# Sample static benchmark: Part I on the committed sample scenes (no detector weights or GPU
# needed):
#
#   stabilo-benchmark static configs/sample/static.yaml -v 1
#   stabilo-benchmark report data/sample/static/results/smoke
#
# configs/songdo/static/detectors.yaml restricted to ORB and SIFT, with 5 trials per scene
# instead of 100. Three scenes exercise every code path but support no conclusion. See
# data/sample/README.md.
# =============================================================================

kind: static
name: smoke
seed: 0
trials: 5

scenes:
  # Relative to this config. See data/sample/README.md for its source and license.
  dir: ../../data/sample/static # images/, labels_hbb/, labels_obb/

perturbation:
  geometric:
    translation_ratio: 0.10
    rotation_deg: 15.0
    scale_ratio: 0.05
    projective: 5.0e-5
  photometric:
    - { name: brightness, range: [0.75, 1.25] }
    - { name: saturation, range: [0.95, 1.05] }
    - { name: blur, max_ksize: 5 }
    - { name: fog, max_density: 0.10 }
    - { name: noise, max_sigma: 3.0 }
    - { name: jpeg, quality: [70, 95] }

metrics:
  hea_thresholds: [1.0, 2.0, 3.0, 5.0, 10.0]
  # Boxes IoU and OCE are scored on, whatever the masking mode: obb (default) or hbb.
  object_boxes: obb

pipeline:
  preset: [orb, sift]
  masking: [none, hbb, obb]
